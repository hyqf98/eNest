name: Shortcut platform checks

on:
  pull_request:
    paths:
      - 'src/main/hotkey/**'
      - 'src/main/paths/**'
      - 'src/shared/accelerator*'
      - 'package*.json'
      - 'electron-builder.yml'
      - '.github/workflows/shortcut-platforms.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shortcuts:
    name: Native registration (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    env:
      ENEST_HOTKEY_PLATFORM_NATIVE: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install Linux desktop test dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libgtk-3-0 libnss3 libxss1 libasound2 libgbm1 xvfb xauth
      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund
      - name: Accelerator aliases and local user paths across all platforms
        run: node --test tests/shared/accelerator.test.mjs tests/main/paths/userPath.test.mjs
      - name: Native macOS and Windows registration
        if: runner.os != 'Linux'
        run: node --test tests/main/hotkey/hotkeyPlatform.native.test.mjs
      - name: Native Linux X11 registration (Wayland requires desktop acceptance)
        if: runner.os == 'Linux'
        run: xvfb-run -a node --test tests/main/hotkey/hotkeyPlatform.native.test.mjs
