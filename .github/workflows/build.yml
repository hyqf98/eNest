# 四个原生架构任务构建；发布阶段校验资产并合并 macOS 双架构更新索引。
name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}-${{ matrix.arch }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: macos-15
            platform: mac
            arch: arm64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-22.04
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    env:
      electron_config_cache: ${{ github.workspace }}/.cache/electron
      ELECTRON_BUILDER_CACHE: ${{ github.workspace }}/.cache/electron-builder

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          architecture: ${{ matrix.arch }}
          cache: npm

      - name: Verify native build architecture
        run: node -e "if (process.arch !== '${{ matrix.arch }}') throw new Error('Runner architecture mismatch')"

      - name: Verify package and release versions
        shell: bash
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node <<'NODE'
          const pkg = require('./package.json')
          const lock = require('./package-lock.json')
          if (lock.version !== pkg.version || lock.packages?.['']?.version !== pkg.version) {
            throw new Error('Package and lockfile versions differ')
          }
          const ref = process.env.RELEASE_REF
          if (ref.startsWith('refs/tags/') && ref !== `refs/tags/v${pkg.version}`) {
            throw new Error(`Release tag ${ref} does not match package version ${pkg.version}`)
          }
          NODE

      - name: Cache Electron and packaging tools
        uses: actions/cache@v4
        with:
          path: |
            .cache/electron
            .cache/electron-builder
            ~/.electron-gyp
          key: packaging-v1-${{ runner.os }}-${{ matrix.arch }}-node24-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            packaging-v1-${{ runner.os }}-${{ matrix.arch }}-node24-

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 保持 glibc 2.35 发布基线，不切换到较新的 Linux 构建镜像。
      - name: Install Linux native helper build dependencies
        if: matrix.platform == 'linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends build-essential pkg-config libglib2.0-dev libjson-glib-dev libx11-dev libxtst-dev patchelf

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # 发布所需源码与契约校验必须通过；历史迁移用例另行保留报告。
      - name: Typecheck and source contracts
        if: matrix.platform == 'linux'
        run: npm run typecheck && npm run audit:source && npm run audit:contracts && npm run associations:check

      - name: Historical packaging suite
        id: historical_packaging
        if: matrix.platform == 'linux'
        continue-on-error: true
        run: npm run test:packaging

      - name: Record historical suite failures
        if: matrix.platform == 'linux' && steps.historical_packaging.outcome == 'failure'
        shell: bash
        run: |
          echo '::warning::Historical packaging tests failed; see their logs. This is not a passing test result. Native packaging and release integrity checks remain required.'
          printf '%s\n' '### Historical test boundary' 'The historical packaging suite failed. Its logs are retained, but these legacy assertions do not block publishing. Type checks, source contracts, native package validation, licenses, architecture checks and release checksums remain mandatory.' >> "$GITHUB_STEP_SUMMARY"

      - name: Build renderer/main and bundled license notices
        run: npm run build
        env:
          ENEST_GITHUB_CLIENT_ID: ${{ vars.ENEST_GITHUB_CLIENT_ID }}
          ENEST_GITHUB_TOKEN_EXCHANGE_URL: ${{ vars.ENEST_GITHUB_TOKEN_EXCHANGE_URL }}
          ENEST_GITHUB_DEVICE_FLOW: ${{ vars.ENEST_GITHUB_DEVICE_FLOW }}

      - name: Verify production source boundaries
        if: matrix.platform == 'linux'
        run: npm run audit:source -- --build-output

      - name: Package (${{ matrix.platform }}-${{ matrix.arch }})
        run: npx --no-install electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --config.electronDownload.cache=.cache/electron --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Record artifact sizes, SHA-256 and verified native architectures
        shell: bash
        run: |
          PLATFORM='${{ matrix.platform }}'
          if [ "$PLATFORM" = mac ]; then PLATFORM=darwin; fi
          if [ "$PLATFORM" = win ]; then PLATFORM=win32; fi
          node tools/packaging/release-manifest.mjs release "$PLATFORM" '${{ matrix.arch }}'

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: enest-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          compression-level: 0
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml
            release/release-manifest-*.json
          retention-days: 14

  release:
    name: Validate and publish release assets
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 只需解析 YAML 的工具依赖；保留各矩阵目录，避免 latest-mac.yml 被覆盖。
      - name: Install release tools
        run: npm ci --ignore-scripts --prefer-offline --no-audit --no-fund
      - name: Download architecture artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: enest-*
          path: artifacts
          merge-multiple: false
      - name: Verify checksums and merge update metadata
        run: node tools/packaging/assemble-release.mjs artifacts release-assets
      - name: Upload combined update metadata
        uses: actions/upload-artifact@v4
        with:
          name: enest-update-metadata
          path: release-assets/latest*.yml
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - name: Verify release tag still points to this build
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          RELEASE_REF: ${{ github.ref }}
        run: |
          node <<'NODE'
          const { execFileSync } = require('node:child_process')
          const ref = process.env.RELEASE_REF
          const head = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim()
          const output = execFileSync('git', ['ls-remote', '--exit-code', 'origin', ref, `${ref}^{}`], { encoding: 'utf8' })
          const refs = new Map(output.trim().split(/\r?\n/).map(line => {
            const [sha, name] = line.split(/\s+/)
            return [name, sha]
          }))
          if ((refs.get(`${ref}^{}`) || refs.get(ref)) !== head) {
            throw new Error('Release tag moved; refuse to publish stale build artifacts')
          }
          console.log(`Publishing ${ref} from ${head}`)
          NODE
      - name: Create / update published release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          files: release-assets/*
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
