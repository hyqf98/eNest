# electron-builder 打包配置（YAML 会被自动发现，无需 --config）
# 打包图标放 build/icon.{icns,ico,png}；assets/icons 仅为运行时图标
# 运行时 extraResources：assets/icons → Resources/icons（存储走 node:sqlite，无原生依赖）

appId: com.enest.shell
productName: eNest
copyright: Copyright © 2026 eNest
directories:
  output: release
  buildResources: build

# GitHub Releases 自动更新源（electron-updater 读取 app-update.yml）
publish:
  provider: github
  owner: hyqf98
  repo: eNest
  releaseType: release

files:
  - out/**/*
  - package.json
  # node-gyp's local Python symlinks are build tools, not runtime dependencies.
  - '!**/node_modules/**/build/node_gyp_bins{,/**/*}'

asar: true
extraResources:
  - from: assets/icons
    to: icons
  - from: native/bin
    to: native

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

mac:
  category: public.app-category.productivity
  # electron-builder 使用 build 下的 icon.icns / icon.png
  icon: build/icon.icns
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  # NSIS 需要 .ico；统一用 build/icon.ico
  icon: build/icon.ico
  target:
    - target: nsis
      arch: [x64]

linux:
  icon: build/icon.png
  category: Utility
  synopsis: Plugin-based desktop shell
  desktop:
    StartupWMClass: enest
  # AppImage 支持 electron-updater；deb 仅作分发安装包
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  publish:
    provider: github
    owner: hyqf98
    repo: eNest

# Windows 安装向导：多步安装，可自定义安装目录
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: eNest
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerLanguages: [zh_CN, en_US]

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
