# electron-builder 打包配置（YAML 会被自动发现，无需 --config）
# 打包图标放 build/icon.{icns,ico,png}；assets/icons 仅为运行时图标
# 运行时 extraResources：assets/icons → Resources/icons（存储走 node:sqlite，无原生依赖）

appId: com.github.eNest.shell
productName: eNest
copyright: Copyright © 2026 eNest
directories:
  output: release
  buildResources: build

# GitHub Releases 自动更新源（electron-updater 读取 app-update.yml）
publish:
  provider: github
  owner: hyqf98
  repo: eNest
  releaseType: release

files:
  - out/**/*
  - package.json
  # node-gyp's local Python symlinks are build tools, not runtime dependencies.
  - '!**/node_modules/**/build/node_gyp_bins{,/**/*}'
  - '!**/node_modules/json-schema-traverse/spec{,/**/*}'
  - '!**/*.map'

asar: true
# 壳支持中英文；保留 Chromium 必需运行文件及许可证。
electronLanguages: [en-US, zh-CN, zh-TW]
afterPack: tools/packaging/after-pack.mjs
extraResources:
  - from: assets/icons
    to: icons
    filter: [enest-icon-256.png, dock-runtime.png]

artifactName: ${productName}-${version}-${os}-${arch}.${ext}

# —— 由 scripts/generate-builder-associations.mjs 生成（源：build/open-with.json），请勿手改 ——
# macOS: Info.plist CFBundleURLTypes / CFBundleDocumentTypes；Windows: NSIS 注册；Linux: .desktop MimeType
protocols:
  - name: "eNest 打开方式"
    schemes:
      - enest
  - name: "eNest Markdown"
    schemes:
      - enest-md
  - name: "eNest Database"
    schemes:
      - enest-db
fileAssociations:
  - ext: "md"
    name: "Markdown 文档"
    role: "Editor"
  - ext: "markdown"
    name: "Markdown 文档"
    role: "Editor"
  - ext: "json"
    name: "JSON 文件"
    role: "Editor"
  - ext: "jsonc"
    name: "JSONC 文件"
    role: "Editor"
  - ext: "db"
    name: "SQLite 数据库"
    role: "Viewer"
  - ext: "sqlite"
    name: "SQLite 数据库"
    role: "Viewer"
  - ext: "png"
    name: "PNG 图片"
    role: "Viewer"
  - ext: "jpg"
    name: "JPEG 图片"
    role: "Viewer"
  - ext: "jpeg"
    name: "JPEG 图片"
    role: "Viewer"
  - ext: "webp"
    name: "WebP 图片"
    role: "Viewer"
  - ext: "gif"
    name: "GIF 图片"
    role: "Viewer"
  - ext: "txt"
    name: "文本文件"
    role: "Viewer"
  - ext: "log"
    name: "日志文件"
    role: "Viewer"

mac:
  # macOS .lproj 使用下划线；26.x 同时裁剪 app 与 Framework 中的语言包。
  electronLanguages: [en, zh_CN, zh_TW]
  category: public.app-category.productivity
  # electron-builder 使用 build 下的 icon.icns / icon.png
  icon: build/icon.icns
  extraResources:
    - from: native/bin
      to: native
      filter: [clipboard-helper, process-memory-helper]
  hardenedRuntime: false
  gatekeeperAssess: false
  target:
    - target: dmg
      arch: [x64, arm64]
    - target: zip
      arch: [x64, arm64]

win:
  # NSIS 需要 .ico；统一用 build/icon.ico
  icon: build/icon.ico
  extraResources:
    - from: native/bin
      to: native
      filter: [clipboard-helper.ps1, process-memory-helper.ps1]
  target:
    - target: nsis
      arch: [x64]
    - target: zip
      arch: [x64]

linux:
  icon: build/icon.png
  extraResources:
    - from: native/bin
      to: native
      filter:
        - clipboard-helper
        - lib/**/*
        - licenses/**/*
        - linux-dependencies.json
        - THIRD-PARTY-NOTICES.txt
  syncDesktopName: true
  category: Utility
  synopsis: Plugin-based desktop shell
  desktop:
    entry:
      StartupWMClass: com.github.eNest.shell
  # AppImage 支持 electron-updater；deb 仅作分发安装包
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  publish:
    provider: github
    owner: hyqf98
    repo: eNest

# Windows 安装向导：多步安装，可自定义安装目录
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  deleteAppDataOnUninstall: false
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: eNest
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  installerLanguages: [zh_CN, en_US]

dmg:
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications
