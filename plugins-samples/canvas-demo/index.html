<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Canvas 动效演示</title>
    <!--
      可选：静态引入壳子主题 CSS（动态更新以 enest.ui.onThemeChange 为准）
      <link rel="stylesheet" href="enest://plugin/com.enest.canvas-demo/__enest_theme.css" />
    -->
    <style>
      /* 默认兜底 Token；壳子 themeAware 注入后会被 CSS 变量覆盖 */
      :root {
        --bg: #0a0c10;
        --surface: #12151c;
        --text: #f2f4f8;
        --text-2: #9aa3b5;
        --accent: #5b8cff;
        --ok: #3ecf8e;
        --border: rgba(255, 255, 255, 0.06);
      }
      * { box-sizing: border-box; }
      html, body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        /* ui.background=transparent：页面底色透明，透出壳子背景 */
        background: transparent !important;
        font-family: Inter, 'PingFang SC', system-ui, sans-serif;
        color: var(--text);
      }
      #stage {
        position: relative;
        width: 100%;
        height: 100%;
      }
      canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .hud {
        position: absolute;
        left: 20px;
        bottom: 20px;
        z-index: 2;
        padding: 12px 16px;
        border-radius: 12px;
        background: color-mix(in srgb, var(--surface) 82%, transparent);
        border: 1px solid var(--border);
        backdrop-filter: blur(10px);
        font-size: 12px;
        line-height: 1.5;
        color: var(--text-2);
        pointer-events: none;
        max-width: 280px;
      }
      .hud strong {
        display: block;
        color: var(--text);
        font-size: 13px;
        margin-bottom: 4px;
      }
      .chip {
        display: inline-block;
        margin-top: 6px;
        padding: 2px 8px;
        border-radius: 999px;
        background: color-mix(in srgb, var(--accent) 18%, transparent);
        color: var(--accent);
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <div id="stage">
      <canvas id="c"></canvas>
      <div class="hud">
        <strong>Canvas 动效演示</strong>
        chrome=none · themeAware · background=transparent
        <div>
          主题：<span id="mode">…</span>
          <span class="chip" id="scheme">auto</span>
        </div>
      </div>
    </div>
    <script>
      const api = window.enest || window.zapi
      const canvas = document.getElementById('c')
      const ctx = canvas.getContext('2d')
      const modeEl = document.getElementById('mode')

      /** 当前主题 Token（CSS 变量名 → 值）；初始用 computedStyle 兜底 */
      let theme = {
        mode: 'dark',
        tokens: {
          '--bg': '#0a0c10',
          '--text': '#f2f4f8',
          '--accent': '#5b8cff',
          '--ok': '#3ecf8e',
          '--surface': '#12151c',
        },
      }

      function cssVar(name, fallback) {
        const v = theme.tokens[name]
        if (v) return v
        const computed = getComputedStyle(document.documentElement).getPropertyValue(name).trim()
        return computed || fallback
      }

      function resize() {
        const dpr = window.devicePixelRatio || 1
        canvas.width = Math.floor(canvas.clientWidth * dpr)
        canvas.height = Math.floor(canvas.clientHeight * dpr)
        ctx.setTransform(dpr, 0, 0, dpr, 0, 0)
      }
      window.addEventListener('resize', resize)
      resize()

      /** 粒子：沿极坐标缓慢漂浮，颜色取自主题 accent / ok */
      const particles = Array.from({ length: 48 }, (_, i) => ({
        a: (i / 48) * Math.PI * 2,
        r: 40 + (i % 8) * 28,
        speed: 0.15 + (i % 5) * 0.04,
        size: 2 + (i % 4),
      }))

      let t0 = performance.now()
      function frame(now) {
        const t = (now - t0) / 1000
        const w = canvas.clientWidth
        const h = canvas.clientHeight
        const cx = w / 2
        const cy = h / 2

        // 透明清屏：不绘制底色，让壳子背景透出
        ctx.clearRect(0, 0, w, h)

        // 中心呼吸圆环
        const accent = cssVar('--accent', '#5b8cff')
        const ok = cssVar('--ok', '#3ecf8e')
        const ringR = Math.min(w, h) * 0.18 + Math.sin(t * 1.2) * 10
        ctx.beginPath()
        ctx.arc(cx, cy, ringR, 0, Math.PI * 2)
        ctx.strokeStyle = accent
        ctx.globalAlpha = 0.55
        ctx.lineWidth = 2
        ctx.stroke()

        // 内环
        ctx.beginPath()
        ctx.arc(cx, cy, ringR * 0.55, 0, Math.PI * 2)
        ctx.strokeStyle = ok
        ctx.globalAlpha = 0.4
        ctx.lineWidth = 1.5
        ctx.stroke()

        // 粒子轨迹
        for (const p of particles) {
          const ang = p.a + t * p.speed
          const x = cx + Math.cos(ang) * (p.r + Math.sin(t + p.a) * 12)
          const y = cy + Math.sin(ang) * (p.r * 0.62 + Math.cos(t * 0.8 + p.a) * 10)
          ctx.beginPath()
          ctx.arc(x, y, p.size, 0, Math.PI * 2)
          ctx.fillStyle = p.size % 2 === 0 ? accent : ok
          ctx.globalAlpha = 0.35 + 0.35 * Math.sin(t * 2 + p.a)
          ctx.fill()
        }

        ctx.globalAlpha = 1
        requestAnimationFrame(frame)
      }
      requestAnimationFrame(frame)

      function applyTheme(payload) {
        theme = payload
        modeEl.textContent = payload.mode === 'dark' ? '深色' : '浅色'
        document.documentElement.dataset.theme = payload.mode
      }

      async function boot() {
        if (api) {
          try {
            api.setTitle('Canvas 动效')
          } catch (_) {}
          try {
            const tokens =
              api.theme && api.theme.getTokens
                ? await api.theme.getTokens()
                : api.ui && api.ui.getThemeTokens
                  ? await api.ui.getThemeTokens()
                  : null
            if (tokens && tokens.tokens) applyTheme(tokens)
          } catch (_) {}
          // 壳子主题变更（设置页切换 / 系统主题）
          const off =
            api.ui && api.ui.onThemeChange
              ? api.ui.onThemeChange(applyTheme)
              : api.on
                ? (api.on('theme-change', applyTheme), () => api.off('theme-change', applyTheme))
                : () => {}
          // 卸载时取消订阅（SPA 场景）
          window.addEventListener('pagehide', () => off && off())
        }
      }
      void boot()
    </script>
  </body>
</html>
