<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>翻译</title>
    <style>
      :root {
        --bg: #0f1419;
        --surface: #161b22;
        --surface-2: #1c2330;
        --border: rgba(255, 255, 255, 0.08);
        --text: #e8eef7;
        --text-2: #9aa7b8;
        --text-3: #6b7789;
        --accent: #f5a524;
        --ok: #3dd68c;
        --danger: #ff6b7a;
      }
      * { box-sizing: border-box; }
      html, body { height: 100%; }
      body {
        margin: 0;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .app {
        display: grid;
        grid-template-rows: auto auto 1fr auto;
        height: 100%;
        min-height: 0;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 12px 16px;
        border-bottom: 1px solid var(--border);
      }
      h1 { margin: 0; font-size: 15px; font-weight: 600; }
      .bar {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        border-bottom: 1px solid var(--border);
        background: var(--surface);
      }
      select {
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        border-radius: 10px;
        padding: 7px 10px;
        font-size: 12px;
      }
      .swap {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        width: 32px;
        height: 32px;
        border-radius: 50%;
        cursor: pointer;
        font-size: 14px;
      }
      .btn {
        appearance: none;
        border: 1px solid var(--border);
        background: var(--surface-2);
        color: var(--text);
        padding: 7px 12px;
        border-radius: 10px;
        font-size: 12px;
        cursor: pointer;
      }
      .btn.primary {
        background: var(--accent);
        border-color: transparent;
        color: #1a1200;
        font-weight: 600;
      }
      .btn:disabled { opacity: 0.45; cursor: not-allowed; }
      .panes {
        display: grid;
        grid-template-columns: 1fr 1fr;
        min-height: 0;
      }
      .pane {
        display: flex;
        flex-direction: column;
        min-height: 0;
        border-right: 1px solid var(--border);
      }
      .pane:last-child { border-right: 0; }
      textarea, .out {
        flex: 1;
        min-height: 160px;
        border: 0;
        resize: none;
        padding: 14px 16px;
        font-size: 14px;
        line-height: 1.55;
        background: transparent;
        color: var(--text);
        outline: none;
        font-family: inherit;
      }
      .out {
        white-space: pre-wrap;
        word-break: break-word;
        overflow: auto;
        background: var(--surface);
      }
      .out.placeholder { color: var(--text-3); }
      footer {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        align-items: center;
        padding: 10px 16px;
        border-top: 1px solid var(--border);
        font-size: 12px;
        color: var(--text-3);
      }
      @media (max-width: 640px) {
        .panes { grid-template-columns: 1fr; grid-template-rows: 1fr 1fr; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>翻译</h1>
        <div id="detected">谷歌翻译</div>
      </header>
      <div class="bar">
        <select id="src">
          <option value="auto" selected>自动检测</option>
          <option value="zh-CN">中文</option>
          <option value="en">英语</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
          <option value="fr">法语</option>
          <option value="de">德语</option>
          <option value="es">西班牙语</option>
          <option value="ru">俄语</option>
        </select>
        <button class="swap" id="swap" title="交换语言">⇄</button>
        <select id="tgt">
          <option value="zh-CN" selected>中文</option>
          <option value="en">英语</option>
          <option value="ja">日语</option>
          <option value="ko">韩语</option>
          <option value="fr">法语</option>
          <option value="de">德语</option>
          <option value="es">西班牙语</option>
          <option value="ru">俄语</option>
        </select>
        <button class="btn" id="btn-paste">粘贴</button>
        <button class="btn primary" id="btn-run">翻译</button>
      </div>
      <div class="panes">
        <div class="pane">
          <textarea id="input" placeholder="输入或粘贴要翻译的文本…"></textarea>
        </div>
        <div class="pane">
          <div class="out placeholder" id="output">译文将显示在这里</div>
        </div>
      </div>
      <footer>
        <span id="meta"></span>
        <span style="display:flex;gap:8px">
          <button class="btn" id="btn-copy">复制译文</button>
        </span>
      </footer>
    </div>
    <script>
      const api = window.enest || window.zapi
      const $ = (id) => document.getElementById(id)
      let lastResult = ''
      let debounceTimer = null

      const toast = async (message, type = 'info') => {
        try { await api?.ui?.toast?.({ message, type }) } catch {}
      }
      const isPerm = (err) => String(err?.message || err).includes('permission denied')

      async function loadPrefs() {
        try {
          const src = await api.settings.get('srcLang')
          const tgt = await api.settings.get('tgtLang')
          if (src) $('src').value = src
          if (tgt) $('tgt').value = tgt
        } catch {}
      }
      async function savePrefs() {
        try {
          await api.settings.set('srcLang', $('src').value)
          await api.settings.set('tgtLang', $('tgt').value)
        } catch {}
      }

      function parseGoogle(raw) {
        // translate_a/single → [[["译文","原文",null,null,10]],null,"en",...]
        let data
        try {
          data = JSON.parse(raw)
        } catch {
          throw new Error('翻译响应解析失败')
        }
        if (!Array.isArray(data) || !Array.isArray(data[0])) {
          throw new Error('翻译响应格式异常')
        }
        const text = data[0]
          .filter((seg) => Array.isArray(seg) && typeof seg[0] === 'string')
          .map((seg) => seg[0])
          .join('')
        const detected = typeof data[2] === 'string' ? data[2] : ''
        return { text, detected }
      }

      async function translate(text) {
        const src = $('src').value || 'auto'
        const tgt = $('tgt').value || 'zh-CN'
        const url =
          'https://translate.googleapis.com/translate_a/single?client=gtx&sl=' +
          encodeURIComponent(src) +
          '&tl=' +
          encodeURIComponent(tgt) +
          '&dt=t&q=' +
          encodeURIComponent(text)
        if (!api?.net?.fetch) throw new Error('eNest API 不可用')
        const res = await api.net.fetch({ url, method: 'GET', timeoutMs: 15000 })
        if (res.status >= 400) throw new Error('翻译服务 HTTP ' + res.status)
        return parseGoogle(res.body)
      }

      async function run() {
        const text = $('input').value.trim()
        if (!text) {
          lastResult = ''
          $('output').textContent = '译文将显示在这里'
          $('output').classList.add('placeholder')
          $('detected').textContent = '谷歌翻译'
          $('meta').textContent = ''
          return
        }
        $('output').textContent = '翻译中…'
        $('output').classList.remove('placeholder')
        try {
          const result = await translate(text)
          lastResult = result.text
          $('output').textContent = result.text || '（空译文）'
          $('detected').textContent = result.detected
            ? '检测到 ' + result.detected + ' → ' + $('tgt').value
            : '谷歌翻译'
          $('meta').textContent = text.length + ' 字符'
        } catch (e) {
          $('output').textContent = '翻译失败：' + String(e.message || e)
          $('output').classList.add('placeholder')
          if (isPerm(e)) toast('缺少 net.fetch 权限', 'error')
        }
      }

      $('input').addEventListener('input', () => {
        clearTimeout(debounceTimer)
        debounceTimer = setTimeout(() => void run(), 500)
      })
      $('btn-run').onclick = () => void run()
      $('src').onchange = () => { savePrefs(); void run() }
      $('tgt').onchange = () => { savePrefs(); void run() }
      $('swap').onclick = () => {
        const s = $('src').value
        const t = $('tgt').value
        if (s !== 'auto') {
          $('src').value = t
          $('tgt').value = s
        } else {
          $('tgt').value = $('detected').textContent?.startsWith('检测到')
            ? $('tgt').value
            : $('tgt').value
        }
        savePrefs()
        void run()
      }
      $('btn-paste').onclick = async () => {
        try {
          const text = await api.clipboard.readText()
          $('input').value = text || ''
          void run()
        } catch (e) {
          toast(isPerm(e) ? '缺少 clipboard.read 权限' : String(e.message || e), 'error')
        }
      }
      $('btn-copy').onclick = async () => {
        if (!lastResult) return
        try {
          await api.clipboard.writeText(lastResult)
          toast('已复制译文', 'success')
        } catch (e) {
          toast(isPerm(e) ? '缺少 clipboard.write 权限' : String(e.message || e), 'error')
        }
      }

      api?.onEnter?.(({ payload }) => {
        if (typeof payload === 'string' && payload) {
          $('input').value = payload
          void run()
        }
      })
      api?.ui?.setTitle?.('翻译')
      loadPrefs()
      $('input').focus()
    </script>
  </body>
</html>
