<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>SSH</title>
    <link rel="stylesheet" href="assets/vendor/xterm/xterm.css" />
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- 左侧：可收起侧栏 -->
      <aside class="sidebar" id="sidebar" data-collapsed="0">
        <div class="side-rail" id="side-rail">
          <button class="rail-btn" id="btn-expand-side" title="展开侧栏" aria-label="展开侧栏" data-tip="展开侧栏">☰</button>
          <button class="rail-btn" id="rail-new" title="新建连接" aria-label="新建连接" data-tip="新建连接">＋</button>
          <button class="rail-btn" id="rail-search" title="搜索连接" aria-label="搜索连接" data-tip="搜索连接">⌕</button>
          <button class="rail-btn" id="rail-drawer" title="历史与常用" aria-label="历史与常用" data-tip="历史与常用">⏱</button>
          <div class="rail-spacer"></div>
          <button class="rail-btn" id="rail-more" title="更多操作" aria-label="更多操作" data-tip="更多操作">⋯</button>
        </div>

        <div class="side-body" id="side-body">
          <div class="side-head">
            <button class="icon-btn" id="btn-collapse-side" title="收起侧栏" aria-label="收起侧栏" data-tip="收起侧栏">‹</button>
            <h1>SSH</h1>
            <div class="spacer"></div>
            <button class="icon-btn" id="btn-side-more" title="更多操作" aria-label="更多操作" data-tip="更多操作">⋯</button>
          </div>
          <div class="side-tools">
            <input id="search-input" type="search" placeholder="搜索" aria-label="搜索连接" />
            <div class="filter-row" id="filter-row"></div>
          </div>
          <div class="sel-bar" id="sel-bar" hidden></div>
          <div class="tree" id="tree">
            <div class="empty">加载中…</div>
          </div>
        </div>
      </aside>

      <!-- 中央 -->
      <main class="main">
        <div class="topbar">
          <div class="top-status" id="top-status">
            <span class="status-dot" id="top-dot"></span>
            <span class="top-name" id="top-name">SSH</span>
            <span class="top-sub" id="top-sub"></span>
          </div>
          <div class="spacer"></div>
          <button class="icon-btn" id="btn-top-search" title="搜索连接" aria-label="搜索连接" data-tip="搜索连接">⌕</button>
          <button class="icon-btn" id="btn-top-drawer" title="历史与常用" aria-label="历史与常用" data-tip="历史与常用">☰</button>
          <button class="icon-btn" id="btn-top-more" title="更多操作" aria-label="更多操作" data-tip="更多操作">⋯</button>
        </div>

        <div class="session-tabs" id="session-tabs"></div>

        <div class="workspace">
          <div class="view-chip" id="view-chip" hidden>
            <button class="icon-btn" id="btn-view-back" title="返回终端" aria-label="返回终端">←</button>
            <span id="view-chip-label">视图</span>
            <div class="spacer"></div>
            <button class="icon-btn" id="btn-view-close" title="关闭视图" aria-label="关闭">×</button>
          </div>

          <section class="panel active" id="panel-term">
            <div class="term-wrap" id="term-wrap">
              <div class="term-banner" id="term-banner"></div>
              <div class="term-empty" id="term-empty">选择连接后开始</div>
              <div id="term-host" class="term-host"></div>
              <!-- 补全浮层叠在终端上，不再单独提供命令输入条 -->
              <div class="completion-list" id="completion-list"></div>
              <div class="hint-meta" id="hint-meta"></div>
              <!-- 无障碍/历史回填用的隐藏输入，非可见 UI -->
              <input id="hint-input" type="text" class="sr-only" tabindex="-1" aria-hidden="true" autocomplete="off" />
            </div>
          </section>

          <section class="panel" id="panel-metrics">
            <div class="metrics-toolbar">
              <button class="btn sm" id="metrics-toggle">开启</button>
              <label class="field-inline">
                <span>ms</span>
                <input id="metrics-interval" type="number" min="2000" max="60000" step="1000" />
              </label>
              <span class="session-status" id="metrics-status"></span>
            </div>
            <div class="metrics-body" id="metrics-body">
              <div class="empty">未开启监控</div>
            </div>
          </section>

          <section class="panel" id="panel-sftp">
            <div class="sftp-toolbar">
              <input id="sftp-path" type="text" placeholder="路径" aria-label="远程路径" />
              <button class="icon-btn" id="btn-sftp-up" title="上一级" aria-label="上一级">↑</button>
              <button class="icon-btn" id="btn-sftp-refresh" title="刷新" aria-label="刷新">↻</button>
              <button class="icon-btn" id="btn-sftp-more" title="更多" aria-label="更多">⋯</button>
            </div>
            <div class="sftp-meta" id="sftp-meta"></div>
            <div class="sftp-list" id="sftp-list">
              <div class="empty">未连接</div>
            </div>
          </section>
        </div>
      </main>

      <!-- 右侧浮层抽屉：历史 / 常用 -->
      <aside class="drawer" id="drawer" aria-hidden="true">
        <div class="drawer-head">
          <div class="drawer-tabs" role="tablist">
            <button data-tab="history" class="active" role="tab">历史</button>
            <button data-tab="snippets" role="tab">常用</button>
          </div>
          <button class="icon-btn" id="btn-drawer-close" title="关闭" aria-label="关闭">×</button>
        </div>
        <div class="drawer-tools">
          <input id="right-search" type="search" placeholder="过滤" aria-label="过滤" />
          <select id="right-scope" aria-label="范围">
            <option value="current">当前</option>
            <option value="all">全部</option>
          </select>
          <button class="icon-btn" id="btn-drawer-more" title="设置" aria-label="设置">⋯</button>
        </div>
        <div class="right-body" id="right-body">
          <div class="empty">加载中…</div>
        </div>
      </aside>
      <div class="drawer-scrim" id="drawer-scrim" hidden></div>
    </div>

    <!-- 单一主操作 FAB -->
    <button class="fab" id="fab" title="新建连接" aria-label="新建连接" data-tip="新建连接">+</button>

    <div class="ctx-menu" id="ctx-menu" role="menu" hidden></div>

    <!-- 连接表单：基础字段 + 高级折叠 -->
    <div class="modal-root" id="form-root">
      <div class="modal">
        <div class="modal-head">
          <h2 id="form-title">新建连接</h2>
          <button class="icon-btn" id="btn-form-cancel" title="关闭" aria-label="关闭">✕</button>
        </div>
        <div class="modal-body">
          <div class="form-error" id="f-form-error"></div>
          <div class="form-grid">
            <label class="field">名称 *
              <input id="f-name" type="text" placeholder="名称" />
            </label>
            <label class="field">环境
              <select id="f-env">
                <option value="prod">prod</option>
                <option value="staging">staging</option>
                <option value="dev" selected>dev</option>
                <option value="test">test</option>
                <option value="custom">自定义</option>
              </select>
            </label>
            <label class="field">主机 *
              <input id="f-host" type="text" placeholder="host" />
            </label>
            <label class="field">端口
              <input id="f-port" type="number" value="22" min="1" max="65535" />
            </label>
            <label class="field">用户名 *
              <input id="f-username" type="text" placeholder="user" />
            </label>
            <label class="field">认证
              <select id="f-auth">
                <option value="password">密码</option>
                <option value="key">私钥</option>
                <option value="agent">Agent</option>
              </select>
            </label>
            <label class="field" id="f-password-wrap">密码
              <input id="f-password" type="password" placeholder="••••" autocomplete="new-password" />
            </label>
            <label class="field" id="f-keypath-wrap">私钥路径
              <input id="f-keypath" type="text" placeholder="~/.ssh/id_ed25519" />
            </label>
            <label class="field" id="f-passphrase-wrap">口令
              <input id="f-passphrase" type="password" placeholder="••••" autocomplete="new-password" />
            </label>
            <div class="field span2 secret-state" id="secret-state"></div>
            <label class="field">分组
              <select id="f-group"></select>
            </label>
            <label class="field">标签
              <input id="f-tags" type="text" placeholder="a, b" />
            </label>
            <label class="field">颜色
              <input id="f-color" type="text" placeholder="#5b8cff" />
            </label>
            <label class="field fav-field">
              <span><input id="f-fav" type="checkbox" style="width:auto" /> 收藏</span>
            </label>
            <label class="field span2">备注
              <textarea id="f-note" placeholder="备注"></textarea>
            </label>
          </div>
          <details class="adv-block" id="adv-block">
            <summary>高级</summary>
            <div class="form-grid adv-grid">
              <label class="field">保活 s
                <input id="f-keepalive" type="number" value="30" min="0" />
              </label>
              <label class="field">超时 ms
                <input id="f-timeout" type="number" value="20000" min="1000" />
              </label>
              <label class="field">TERM
                <input id="f-term" type="text" value="xterm-256color" />
              </label>
              <label class="field">指纹
                <select id="f-fp">
                  <option value="tofu" selected>tofu</option>
                  <option value="accept-new">accept-new</option>
                  <option value="strict">strict</option>
                </select>
              </label>
              <label class="field">cols
                <input id="f-cols" type="number" value="120" />
              </label>
              <label class="field">rows
                <input id="f-rows" type="number" value="32" />
              </label>
              <label class="field">跳板主机
                <input id="f-jump-host" type="text" placeholder="ProxyJump" />
              </label>
              <label class="field">跳板端口
                <input id="f-jump-port" type="number" value="22" />
              </label>
              <label class="field span2">跳板用户
                <input id="f-jump-user" type="text" />
              </label>
            </div>
          </details>
          <div class="host-status" id="form-test-status"></div>
        </div>
        <div class="modal-foot">
          <button class="btn ghost" id="btn-form-test" title="测试连接" aria-label="测试连接">测试</button>
          <button class="btn ghost" id="btn-form-cancel-foot" title="取消" aria-label="取消">取消</button>
          <button class="btn primary" id="btn-form-save" title="保存连接" aria-label="保存连接">保存</button>
        </div>
      </div>
    </div>

    <div class="modal-root" id="confirm-root">
      <div class="modal small">
        <div class="modal-head">
          <h2 id="confirm-title">确认</h2>
        </div>
        <div class="modal-body">
          <div id="confirm-body" class="confirm-body"></div>
        </div>
        <div class="modal-foot">
          <button class="btn ghost" id="confirm-cancel">取消</button>
          <button class="btn primary" id="confirm-ok">确定</button>
        </div>
      </div>
    </div>

    <div class="modal-root" id="prompt-root">
      <div class="modal small">
        <div class="modal-head">
          <h2 id="prompt-title">输入</h2>
        </div>
        <div class="modal-body">
          <input id="prompt-input" type="text" />
        </div>
        <div class="modal-foot">
          <button class="btn ghost" id="prompt-cancel">取消</button>
          <button class="btn primary" id="prompt-ok">确定</button>
        </div>
      </div>
    </div>

    <script src="assets/vendor/xterm/xterm.js"></script>
    <script src="assets/vendor/xterm/addon-fit.js"></script>
    <script src="assets/js/tips-global.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/dict.js"></script>
    <script src="assets/js/store.js"></script>
    <script src="assets/js/term.js"></script>
    <script src="assets/js/app.js"></script>
  </body>
</html>
