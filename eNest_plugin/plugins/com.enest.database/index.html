<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>数据库</title>
    <link rel="stylesheet" href="assets/css/main.css" />
  </head>
  <body>
    <div class="app" id="app">
      <!-- 顶栏：侧栏开关 + 连接状态 + ⋯ -->
      <header class="topbar">
        <button type="button" class="btn icon" id="side-toggle" title="展开/收起侧栏" aria-label="展开/收起侧栏" data-tip="展开/收起侧栏">≡</button>
        <div class="topbar-ctx" id="toolbar"></div>
        <div class="spacer"></div>
        <button type="button" class="btn icon" id="top-more" title="更多操作" aria-label="更多操作" data-tip="更多操作">⋯</button>
      </header>

      <div class="workspace">
        <aside class="side" id="side"></aside>
        <div class="resizer left" id="resizer-left"></div>

        <div class="mid-col">
          <div class="sql-tabs" id="editor-tabs"></div>
          <div class="editor-pane">
            <div class="editor-host" id="editor-host"></div>
            <div class="fab-dock" id="fab-dock">
              <button type="button" class="fab-execute" id="fab-run" title="执行当前语句" aria-label="执行当前语句" data-tip="执行当前语句">▶</button>
              <button type="button" class="fab-more" id="fab-more" title="执行选项（全部/选中/计划）" aria-label="执行选项" data-tip="执行选项">⋯</button>
            </div>
          </div>
          <div class="resizer bottom" id="resizer-bottom"></div>
          <div class="results" id="results"></div>
        </div>

        <div class="resizer right" id="resizer-right"></div>
        <aside class="right-panel" id="right-panel" hidden></aside>
      </div>

      <footer class="statusbar" id="statusbar"></footer>
    </div>

    <div id="modal-root"></div>
    <div id="local-toast" hidden></div>

    <script type="module" src="assets/js/main.js"></script>
  </body>
</html>
