<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1d222b"/>
      <stop offset="1" stop-color="#0f1115"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="28" fill="url(#bg)"/>
  <!-- 像素猫轮廓（致敬 spritesheet 风格） -->
  <g fill="#ff7a45">
    <!-- 耳朵 -->
    <rect x="34" y="30" width="10" height="10"/><rect x="44" y="40" width="6" height="6"/>
    <rect x="84" y="30" width="10" height="10"/><rect x="78" y="40" width="6" height="6"/>
  </g>
  <g fill="#e8ecf1">
    <!-- 头 -->
    <rect x="38" y="46" width="52" height="34" rx="8"/>
    <!-- 身体 -->
    <rect x="44" y="82" width="40" height="20" rx="8"/>
  </g>
  <g fill="#0f1115">
    <!-- 眼睛 -->
    <rect x="50" y="58" width="8" height="10" rx="2"/>
    <rect x="70" y="58" width="8" height="10" rx="2"/>
    <!-- 鼻嘴 -->
    <rect x="61" y="72" width="6" height="4" rx="1"/>
  </g>
  <!-- 下载安装角标 -->
  <circle cx="96" cy="94" r="18" fill="#3dd68c"/>
  <path d="M96 84v12m0 0l-6-6m6 6l6-6" stroke="#0f1115" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
