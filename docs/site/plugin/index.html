<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>插件开发文档 — eNest</title>
  <meta name="description" content="eNest 插件开发文档：快速开始、plugin.json、完整 zapi API 参考、权限、调试、生命周期与错误码。" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../assets/icons/enest-icon-256.png" />

  <!-- Docsify 基础布局主题（被 assets/docs.css 覆盖视觉） -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css" />
  <!-- eNest 自定义浅色主题 -->
  <link rel="stylesheet" href="assets/docs.css" />

  <!-- 字体：优先本地 Inter / PingFang SC / 系统字体，避免额外网络依赖 -->
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <style>
    /* 仅保留 docs.css 无法覆盖的启动态细节 */
    #app { color: var(--enest-muted, #5c6578); text-align: center; padding-top: 40vh; font-family: var(--enest-font, sans-serif); }
  </style>
</head>
<body>
  <!-- 官网 / 仓库快捷入口 -->
  <div class="enest-topbar">
    <a href="../">官网</a>
    <a href="https://github.com/" rel="noopener noreferrer">GitHub</a>
  </div>

  <!-- Docsify 挂载点 -->
  <div id="app">正在加载插件开发文档…</div>

  <script>
    /**
     * Docsify 配置
     * 注意：插件脚本放在 docsify 之前定义（$docsify 需在运行时前就绪）
     */
    window.$docsify = {
      name: 'eNest 插件开发',
      nameLink: '/',
      repo: 'https://github.com/',

      loadSidebar: true,
      loadNavbar: true,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      relativePath: false,
      topMargin: 72,

      alias: {
        '/.*/_navbar.md': '/_navbar.md',
        '/.*/_sidebar.md': '/_sidebar.md'
      },

      // 全文搜索
      search: {
        placeholder: '搜索文档',
        noData: '没有找到相关内容',
        depth: 4,
        hideOtherSidebarContent: true,
        namespace: 'enest-plugin-docs'
      },

      // 代码高亮（内置 prism）
      // 外链不强制新窗口，站内跳转保持 SPA 体验
      externalLinkTarget: '_blank',
      externalLinkRel: 'noopener noreferrer',

      // 禁用 emoji 渲染，保留代码原样
      emoji: false,

      plugins: [
        // 文档标题同步到浏览器标签
        function (hook, vm) {
          hook.doneEach(function () {
            var h1 = document.querySelector('h1');
            document.title = (h1 ? h1.innerText.trim() : '插件开发') + ' — eNest 插件文档';
          });
        },
        // 简易进度条：路由切换时提示
        function (hook, vm) {
          var bar = document.createElement('div');
          bar.style.cssText =
            'position:fixed;top:0;left:0;height:2px;width:0;' +
            'background:linear-gradient(90deg,#14b892,#5eead4);z-index:99;' +
            'transition:width .25s ease,opacity .3s ease;opacity:0;pointer-events:none;';
          document.body.appendChild(bar);
          hook.beforeEach(function () {
            bar.style.opacity = '1';
            bar.style.width = '30%';
          });
          hook.doneEach(function () {
            bar.style.width = '100%';
            setTimeout(function () {
              bar.style.opacity = '0';
              setTimeout(function () { bar.style.width = '0'; }, 280);
            }, 160);
          });
        }
      ]
    };
  </script>

  <!-- Docsify 运行时 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <!-- 全文搜索 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <!-- 外链脚本支持 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/external-script.min.js"></script>
  <!-- 分页导航 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <!-- 复制代码按钮 -->
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <!-- Mermaid（生命周期状态图）：先 mermaid 核心，再 docsify 桥接 -->
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/mermaid.min.js"></script>
</body>
</html>
