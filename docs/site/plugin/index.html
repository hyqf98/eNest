<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <title>插件开发文档 — eNest</title>
  <meta name="description" content="eNest 插件开发文档：快速开始、plugin.json、完整 enest API 参考、权限、调试、生命周期与错误码。" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link rel="icon" href="../assets/icons/enest-icon-256.png" />
  <!-- 自建主题，不依赖 Docsify 官方 vue.css -->
  <link rel="stylesheet" href="assets/docs.css" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin />

  <style>
    #app {
      color: var(--muted);
      text-align: center;
      padding-top: 40vh;
      font-family: var(--font, sans-serif);
    }
  </style>
</head>
<body>
  <div class="enest-topbar">
    <a class="enest-brand" href="../index.html" title="返回官网首页">
      <img src="../assets/icons/enest-icon-256.png" alt="" />
      eNest
    </a>
    <div class="enest-topbar-links">
      <a href="../index.html">首页</a>
      <a href="../index.html#features">产品</a>
      <a href="../download.html">下载</a>
      <a class="is-docs" href="./">文档</a>
      <a href="https://github.com/hyqf98/eNest" rel="noopener noreferrer">GitHub</a>
      <button class="docs-theme-btn" type="button" data-theme-toggle aria-label="切换主题" title="切换浅色 / 深色">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 14.5A8.5 8.5 0 1 1 9.5 3a7 7 0 0 0 11.5 11.5z"/></svg>
      </button>
    </div>
  </div>

  <div id="app">正在加载插件开发文档…</div>

  <script>
    (function () {
      var stored = null;
      try { stored = localStorage.getItem('enest-site-theme'); } catch (e) {}
      var theme = stored === 'light' || stored === 'dark'
        ? stored
        : (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      document.documentElement.setAttribute('data-theme', theme);
      document.addEventListener('DOMContentLoaded', function () {
        document.querySelectorAll('[data-theme-toggle]').forEach(function (btn) {
          btn.addEventListener('click', function () {
            var next = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('enest-site-theme', next); } catch (e) {}
          });
        });
      });
    })();

    window.$docsify = {
      name: 'eNest 插件开发',
      nameLink: '../index.html',
      repo: 'https://github.com/hyqf98/eNest',

      loadSidebar: true,
      loadNavbar: false,
      subMaxLevel: 3,
      maxLevel: 4,
      auto2top: true,
      relativePath: false,
      topMargin: 72,

      alias: {
        '/.*/_sidebar.md': '/_sidebar.md'
      },

      search: {
        placeholder: '搜索文档',
        noData: '没有找到相关内容',
        depth: 4,
        hideOtherSidebarContent: true,
        namespace: 'enest-plugin-docs'
      },

      externalLinkTarget: '_blank',
      externalLinkRel: 'noopener noreferrer',
      emoji: false,

      plugins: [
        function (hook) {
          hook.doneEach(function () {
            var h1 = document.querySelector('h1');
            document.title = (h1 ? h1.innerText.trim() : '插件开发') + ' — eNest 插件文档';
          });
        },
        function (hook) {
          var bar = document.createElement('div');
          bar.style.cssText =
            'position:fixed;top:0;left:0;height:2px;width:0;' +
            'background:linear-gradient(90deg,#0d9f6e,#5eead4);z-index:99;' +
            'transition:width .25s ease,opacity .3s ease;opacity:0;pointer-events:none;';
          document.body.appendChild(bar);
          hook.beforeEach(function () {
            bar.style.opacity = '1';
            bar.style.width = '30%';
          });
          hook.doneEach(function () {
            bar.style.width = '100%';
            setTimeout(function () {
              bar.style.opacity = '0';
              setTimeout(function () { bar.style.width = '0'; }, 280);
            }, 160);
          });
        }
      ]
    };
  </script>

  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/external-script.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-pagination@2/dist/docsify-pagination.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-copy-code@2"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10.9.1/dist/mermaid.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify-mermaid@2/dist/mermaid.min.js"></script>
</body>
</html>
